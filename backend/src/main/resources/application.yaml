spring:
  mail:
    host: ${ONFIT_SMTP_HOST:}
    port: ${ONFIT_SMTP_PORT:587}
    username: ${ONFIT_SMTP_USERNAME:}
    password: ${ONFIT_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  application:
    name: job-recommendation-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/onfit}
    username: ${DB_USERNAME:onfit}
    password: ${DB_PASSWORD:onfit_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      # Load lazy skill/evidence lists for many jobs in one IN query instead of one query each.
      hibernate.default_batch_fetch_size: 100
  flyway:
    enabled: true
logging:
  pattern:
    level: '%5p [request_id=%X{requestId:-}]'
onfit:
  alerts:
    enabled: ${ONFIT_ALERTS_ENABLED:false}
    mail-from: ${ONFIT_MAIL_FROM:}
    app-url: ${ONFIT_APP_URL:http://localhost:5173}
  ingestion:
    enabled: ${ONFIT_INGESTION_ENABLED:false}
    sources:
      saramin:
        allowed-host: www.saramin.co.kr
        terms-url: https://oapi.saramin.co.kr/guide/info
        reviewed-on: 2026-10-12
        permission-evidence: ${ONFIT_SARAMIN_PERMISSION_EVIDENCE:}
      wanted:
        allowed-host: www.wanted.co.kr
        terms-url: https://openapi.wanted.jobs/
        reviewed-on: 2026-10-12
        permission-evidence: ${ONFIT_WANTED_PERMISSION_EVIDENCE:}
      jobkorea:
        allowed-host: www.jobkorea.co.kr
        terms-url: ${ONFIT_JOBKOREA_TERMS_URL:}
        reviewed-on: 2026-10-12
        permission-evidence: ${ONFIT_JOBKOREA_PERMISSION_EVIDENCE:}
      work24:
        allowed-host: www.work24.go.kr
        terms-url: https://www.work24.go.kr/cm/e/a/0110/selectOpenApiSvcInfo.do
        reviewed-on: 2026-10-12
        permission-evidence: ${ONFIT_WORK24_PERMISSION_EVIDENCE:}
    work24:
      enabled: ${ONFIT_WORK24_ENABLED:false}
      auth-key: ${ONFIT_WORK24_AUTH_KEY:}
      keyword: ${ONFIT_WORK24_KEYWORD:개발자}
      max-pages: ${ONFIT_WORK24_MAX_PAGES:2}
      alert-url: ${ONFIT_INGESTION_ALERT_URL:}
  extraction:
    ocr-enabled: ${ONFIT_OCR_ENABLED:true}
    # paddle: private PaddleOCR service (ocr-service/), tesseract: local command below.
    ocr-engine: ${ONFIT_OCR_ENGINE:paddle}
    ocr-command: ${ONFIT_OCR_COMMAND:tesseract}
    paddle-url: ${ONFIT_OCR_URL:http://127.0.0.1:8002/v1/ocr}
    paddle-token: ${ONFIT_OCR_TOKEN:}
    paddle-timeout-ms: ${ONFIT_OCR_TIMEOUT_MS:60000}
  ai:
    enabled: ${ONFIT_AI_ENABLED:false}
    url: ${ONFIT_AI_URL:http://127.0.0.1:8001/v1/semantic-score}
    token: ${ONFIT_AI_TOKEN:}
    timeout-ms: ${ONFIT_AI_TIMEOUT_MS:5000}
    include-project-descriptions: ${ONFIT_AI_INCLUDE_PROJECT_DESCRIPTIONS:false}
  recommendation:
    retention-days: ${ONFIT_RECOMMENDATION_RETENTION_DAYS:30}
    cleanup-enabled: ${ONFIT_RECOMMENDATION_CLEANUP_ENABLED:true}
  seed:
    enabled: ${ONFIT_SEED_ENABLED:true}
  # Deadlines are judged in this zone. Set ONFIT_FIXED_DATE (yyyy-MM-dd) to pin "today" for demos.
  time-zone: ${ONFIT_TIME_ZONE:Asia/Seoul}
  fixed-date: ${ONFIT_FIXED_DATE:}
