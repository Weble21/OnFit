<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f8f6f1">
<meta name="description" content="나의 경험에서 시작하는 커리어, 온핏. 프로필 기반 기업 추천과 채용공고 적합도 분석.">
<title>온핏 — 나다운 커리어의 시작</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%23b9573f'/%3E%3Ctext x='20' y='28' text-anchor='middle' font-size='29' fill='white'%3Eo%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap"></noscript>
<script>
  // The build puts the landing page in #app; hide it when the URL opens another screen ("#/profile") until React renders.
  if (location.hash.length > 2) document.documentElement.classList.add('deep-link');
</script>
<style>
  .deep-link .prerendered { visibility: hidden; }
  /* Until React renders (it may first check the login session): a quiet loading line instead of a blank page. */
  #app:empty::before, .deep-link #app:has(> .prerendered)::before {
    content: '불러오는 중…'; position: fixed; inset: 0; display: grid; place-items: center;
    background: #f8f7f3; color: #818276; font: 14px "Noto Sans KR", "Malgun Gothic", sans-serif;
  }
</style>
<script type="module" src="/src/main.jsx"></script>
</head>
<!-- #app is the React root; the modal renders into #modal-root so #app can be made inert behind it. -->
<body><div id="app"></div><div id="modal-root"></div>
<noscript>온핏을 사용하려면 JavaScript를 활성화해 주세요.</noscript></body>
</html>
