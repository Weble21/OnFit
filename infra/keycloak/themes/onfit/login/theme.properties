# OnFit login theme: keeps Keycloak's default (keycloak.v2) pages and only restyles them to match the app.
parent=keycloak.v2
import=common/keycloak

# Parent styles first, then the OnFit overrides.
styles=css/styles.css css/onfit.css
scripts=js/onfit.js

# The app has no dark theme, so the login pages stay light as well.
darkMode=false
