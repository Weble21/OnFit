services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: onfit
      POSTGRES_USER: onfit
      POSTGRES_PASSWORD: ${DB_PASSWORD:-onfit_local}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onfit -d onfit"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
